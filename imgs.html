<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Images Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.9.0/slick.min.css" integrity="sha512-yHknP1/AwR+yx26cB1y0cjvQUMvEa2PFzt1c9LlS4pRQ5NOTZFWbhBig+X9G9eYW/8m0/4OXNx8pxJ6z57x0dw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.9.0/slick-theme.min.css" integrity="sha512-17EgCFERpgZKcm0j0fEq1YCJuyAWdz9KUtv1EjVuaOz8pDnh/0nZxmU6BBXwaaxqoi9PQXnRWqlcDB027hgv9A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <style>
    body{
        background-color: rgb(0, 0, 0);
    }
   .main-image{
    display: flex;
    align-items: center;
    justify-content: center;
    /* width: 100%; */
     margin-top: 15px;
    /* object-fit: cover; */
    height: 600px;
   }
    .main-image img {
      /* width: 100%; */
        object-fit: cover;
      height: 100%;
      border: 3px solid #ccc;
      border-radius: 8px;
    }
    .thumbnails {
        width: 100%;
      /* display: flex; */
      /* gap: 5px; */
      margin-top: 15px;
      /* flex-wrap: wrap; */
    }
    .thumbnails img {
      width: 100px;
      object-fit: cover;
      height: 100px;
      border: 2px solid #fff;
      margin: 0 5px;
      cursor: pointer;
    }
    .thumbnails img:hover {
      border-color: red;
    }
    .slick-slide {
  display: flex !important;
  justify-content: center;
}
.thumbnails img.active {
  border-color: red;
}
  </style>
</head>
<body>

<section style=" position: sticky; top: 0; width: 100%;  background: rgba(0, 0, 0, 0.541); height: 60px; z-index: 999; " >
   <div class="container d-flex align-items-center justify-content-end">
    <div>
        <i class="bi bi-plus-lg" style="cursor: pointer; color: #fff; font-size: 2rem; transform: rotate(45deg); display: inline-block;" onclick="declineTerms()"></i>
    </div>
    </div>
</section>
<section>
    <div class="container">
<div class="main-image " id="mainImageContainer"></div>
<div class="thumbnails responsive" id="thumbnailsContainer"></div>

    </div>
</section>



<script src="web/js/script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.9.0/slick.min.js" integrity="sha512-HGOnQO9+SP1V92SrtZfjqxxtLmVzqZpjFFekvzZVWoiASSQgSr4cw9Kqd2+l8Llp4Gm0G8GIFJ4ddwZilcdb8A==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<script>
  // Get stored images
  const allImages = JSON.parse(localStorage.getItem("allImages")) || [];
  const mainImage = localStorage.getItem("mainImage");

  const mainImageContainer = document.getElementById("mainImageContainer");
  const thumbnailsContainer = document.getElementById("thumbnailsContainer");

  // Show main image
  if (mainImage) {
    mainImageContainer.innerHTML = `<img src="${mainImage}" alt="">`;
  }


  allImages.forEach(src => {
    let div = document.createElement("div")
    const img = document.createElement("img");
    img.src = src;
    div.appendChild(img)
    img.onclick = () => {
      mainImageContainer.innerHTML = `<img src="${src}" alt="">`;

       document.querySelectorAll('.thumbnails img').forEach(th => {
      th.classList.remove('active');
    });
    img.classList.add('active');
    };
    thumbnailsContainer.appendChild(div);
  });


  $('.responsive').slick({
  dots: true,
  infinite: false,
  speed: 300,
  slidesToShow: 12,
  slidesToScroll: 1,
  responsive: [
    {
      breakpoint: 1200,
      settings: {
        slidesToShow: 8,
       
      }
    },
    {
      breakpoint: 992,
      settings: {
        slidesToShow: 6,
      }
    },
    {
      breakpoint: 576,
      settings: {
        slidesToShow: 4,
      }
    }
   
  ]
});
</script>

</body>
</html>
