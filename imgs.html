<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Images Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.9.0/slick.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.9.0/slick-theme.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>

    <style>
      body {
        background: black;
        margin: 0;
        padding: 0;
       height: 100vh;
       display: flex;
       flex-direction: column;
       align-items: center;
       justify-content: center;
      }
      .imgtopnav {
        position: fixed;
        top: 0;
        width: 100%;
        background: rgba(0, 0, 0, 0.541);
        height: 60px;
        z-index: 999;
      }
      .imgtopnav i {
        cursor: pointer;
        color: #fff;
        font-size: 2rem;
        transform: rotate(45deg);
        display: inline-block;
      }

      .main-image {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 70px;
        height: calc(100vh - 200px);
         overflow: hidden;
      }
      .main-image img {
        max-width: 100%;
        max-height: 80vh;
        object-fit: contain;
        border-radius: 8px;
      }

      .thumbnails {
        margin-top: 15px;
      }
      .thumbnails img {
        width: 100px;
        height: 100px;
        object-fit: cover;
        border: 2px solid transparent;
        cursor: pointer;
      }
      .thumbnails img.active {
        border-color: red;
      }
      .slick-slide {
        display: flex !important;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <!-- Top bar -->
    <section class="imgtopnav">
      <div class="container d-flex align-items-center justify-content-end">
        <div>
          <i class="bi bi-plus-lg" onclick="declineTerms()"></i>
        </div>
      </div>
    </section>

    <!-- Main Image -->
    <div>
      <div class="main-image" id="mainImageContainer"></div>
    </div>

    <!-- Thumbnails -->
    <div class="container" style="position: sticky; bottom: 0;">
      <div class="thumbnails responsive" id="thumbnailsContainer"></div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.9.0/slick.min.js"></script>
    <script>
      // Load stored images
      const allImages = JSON.parse(localStorage.getItem("allImages")) || [];
      const mainImage = localStorage.getItem("mainImage");

      const mainImageContainer = document.getElementById("mainImageContainer");
      const thumbnailsContainer = document.getElementById("thumbnailsContainer");

      // Show main image
      if (mainImage) {
        mainImageContainer.innerHTML = `<img src="${mainImage}" alt="">`;
      }

      allImages.forEach((src) => {
        let div = document.createElement("div");
        const img = document.createElement("img");
        img.src = src;
        div.appendChild(img);

        img.onclick = () => {
          mainImageContainer.innerHTML = `<img src="${src}" alt="">`;

          document.querySelectorAll(".thumbnails img").forEach((th) => {
            th.classList.remove("active");
          });
          img.classList.add("active");
        };

        thumbnailsContainer.appendChild(div);
      });

      // Slick Carousel
      $(".responsive").slick({
        dots: false,
        infinite: false,
        speed: 300,
        slidesToShow: 8,
        slidesToScroll: 1,
       responsive: [
  { breakpoint: 480, settings: { slidesToShow: 3 } },
  { breakpoint: 768, settings: { slidesToShow: 4 } },
  { breakpoint: 992, settings: { slidesToShow: 5 } },
  { breakpoint: 1200, settings: { slidesToShow: 6 } }
]
      });
    </script>
  </body>
</html>
